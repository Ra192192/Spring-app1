server:
  port: 8080

spring:
  application:
    name: auth-api

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600

data-api:
  base-url: ${DATA_API_URL:http://localhost:8081}
  internal-token: ${INTERNAL_TOKEN}